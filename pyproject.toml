[project]
name = "master-thesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.5.0",
    "accelerate>=1.15.0",
    "anthropic>=1.11.0",
    "datasets>=4.1.1",
    "emoji>=2.16.0",
    "flash-attn>=2.8.3.post1",
    "google~=3.0.0",
    "google-genai>=2.12.1",
    "huggingface-hub>=1.33.0",
    "langdetect>=1.0.9",
    "matplotlib~=3.10.8",
    "nltk>=3.10.3",
    "openai~=1.109.1",
    "pandas~=2.3.2",
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
    "python-dotenv~=1.1.1",
    "scipy~=1.17.0",
    "spacy>=3.8.16",
    "statsmodels~=0.14.6",
    "syllapy>=0.8.0",
    "torch==2.8.*",
    "torchvision>=0.23.*",
    "tqdm>=4.66.5",
    "transformers~=5.2.0",
    "unicodedata2>=18.0.0",
    # 0.11.0 is the vLLM release built against torch 2.8.0, the newest torch the flash-attn wheel below exists for
    "vllm==0.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
tqdm = { index = "pytorch" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
